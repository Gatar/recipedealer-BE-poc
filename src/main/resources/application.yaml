spring:
  application:
    name: recipedealer
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recipedealer}
    username: ${DB_USER:recipedealer}
    password: ${DB_PASSWORD:recipedealer}
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # Keep in sync with request_body max_size in the Caddyfile.
      max-file-size: 25MB
      max-request-size: 50MB

server:
  forward-headers-strategy: framework
  tomcat:
    max-part-count: 64
    # Read (and discard) the rest of a rejected upload so the client receives the 413 instead of a reset.
    max-swallow-size: 64MB

recipedealer:
  storage:
    blob-dir: ${BLOB_DIR:./data/blobs}
  backup:
    dir: ${BACKUP_DIR:./data/backups}
