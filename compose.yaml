# Production stack on the VPS (/srv/recipedealer/app). Secrets come from .env next to this file (see README).
name: recipedealer

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: recipedealer
      POSTGRES_USER: recipedealer
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      # PostgreSQL 18 images keep data in /var/lib/postgresql/<major>/docker, so mount the parent directory.
      - ${DATA_DIR:-/srv/recipedealer}/postgres:/var/lib/postgresql
      - ${DATA_DIR:-/srv/recipedealer}/dumps:/dumps
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipedealer -d recipedealer"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: recipedealer-app:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/recipedealer
      DB_USER: recipedealer
      DB_PASSWORD: ${DB_PASSWORD}
      BLOB_DIR: /data/blobs
      BACKUP_DIR: /data/backups
      RECIPEDEALER_ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME must be set in .env}
      RECIPEDEALER_ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH must be set in .env}
      # Household registration code for POST /v1/auth/register; empty disables registration.
      REGISTRATION_CODE: ${REGISTRATION_CODE:-}
    volumes:
      - ${DATA_DIR:-/srv/recipedealer}/blobs:/data/blobs
      # On-request backups (POST /v1/admin/backups); owned by uid 10001 like blobs.
      - ${DATA_DIR:-/srv/recipedealer}/backups:/data/backups
    expose:
      - "8080"

  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS must be set in .env (server IPv4 or domain)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR:-/srv/recipedealer}/caddy/data:/data
      - ${DATA_DIR:-/srv/recipedealer}/caddy/config:/config
